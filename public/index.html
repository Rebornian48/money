<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manajemen Keuangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
  <!-- Login -->
  <section id="login" class="login hidden">
    <form id="loginForm" class="login-card">
      <div class="brand"><span class="logo">Rp</span> Manajemen Keuangan</div>
      <p class="muted">Masuk untuk mengelola aset dan portofolio Anda.</p>
      <label>Nama pengguna<input name="username" autocomplete="username" required></label>
      <label>Kata sandi<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="loginError" class="error"></p>
      <button class="btn primary block">Masuk</button>
    </form>
  </section>

  <!-- Aplikasi -->
  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo">Rp</span> Keuangan</div>
      <nav id="nav">
        <a data-view="dashboard">Dashboard</a>
        <a data-view="portofolio">Input Portofolio</a>
        <a data-view="obligasi">Obligasi</a>
        <a data-view="saham">Saham</a>
        <a data-view="crypto">Crypto</a>
        <div class="nav-label">Tabel Master</div>
        <a data-view="jenis">Jenis Instrumen</a>
        <a data-view="lembaga">Nama Instrumen</a>
        <a data-view="penyimpanan">Instrumen Penyimpanan</a>
        <div class="nav-label admin-only">Admin</div>
        <a data-view="users" class="admin-only">Pengguna</a>
      </nav>
      <div class="sidebar-foot">
        <div id="whoami" class="muted"></div>
        <button class="btn ghost sm" id="btnPassword">Ganti kata sandi</button>
        <button class="btn ghost sm" id="btnLogout">Keluar</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="btn ghost sm menu-btn" id="btnMenu">☰</button>
        <h1 id="viewTitle">Dashboard</h1>
        <label class="user-pick admin-only">Data milik
          <select id="userPick"></select>
        </label>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- Modal -->
  <dialog id="modal">
    <form id="modalForm" method="dialog">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <p id="modalError" class="error"></p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modalCancel">Batal</button>
        <button class="btn primary" id="modalOk">Simpan</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/js/app.js?v=2"></script>
</body>
</html>
